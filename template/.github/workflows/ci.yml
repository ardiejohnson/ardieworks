# Portfolio CI — makes "checks are green" mean something on every PR.
# Static single-file apps (no package.json) pass automatically; Vite apps must build.
# Canonical copy lives in the ardieworks repo (template/); synced into app-template.
name: build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect app type
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "kind=vite" >> "$GITHUB_OUTPUT"
          else
            echo "kind=static" >> "$GITHUB_OUTPUT"
            echo "Static app (no package.json) — nothing to build."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.kind == 'vite'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.detect.outputs.kind == 'vite'
        run: npm ci
      - name: Build
        if: steps.detect.outputs.kind == 'vite'
        run: npm run build
